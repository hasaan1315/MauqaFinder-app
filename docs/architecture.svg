<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MauqaFinder App request flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1000" height="500" rx="16" fill="#0f172a"/>

  <!-- participants -->
  <rect x="40" y="20" width="180" height="54" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="130" y="43" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">User</text>
  <text x="130" y="61" text-anchor="middle" fill="#94a3b8" font-size="11">Browser</text>

  <rect x="290" y="20" width="180" height="54" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="43" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Vercel</text>
  <text x="380" y="61" text-anchor="middle" fill="#94a3b8" font-size="11">Frontend</text>

  <rect x="540" y="20" width="180" height="54" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="630" y="43" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">FastAPI</text>
  <text x="630" y="61" text-anchor="middle" fill="#94a3b8" font-size="11">Backend</text>

  <rect x="790" y="20" width="180" height="54" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="880" y="43" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Supabase</text>
  <text x="880" y="61" text-anchor="middle" fill="#94a3b8" font-size="11">PostgreSQL + RLS</text>

  <!-- lifelines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="130" y1="74" x2="130" y2="470"/>
    <line x1="380" y1="74" x2="380" y2="470"/>
    <line x1="630" y1="74" x2="630" y2="470"/>
    <line x1="880" y1="74" x2="880" y2="470"/>
  </g>

  <!-- 1 -->
  <line x1="130" y1="120" x2="378" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="254" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12">1 · Enter profile (edu, exp, location)</text>

  <!-- 2 -->
  <line x1="380" y1="175" x2="628" y2="175" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="504" y="165" text-anchor="middle" fill="#e2e8f0" font-size="12">2 · POST /api/profiles</text>
  <text x="504" y="191" text-anchor="middle" fill="#fbbf24" font-size="11">JWT Bearer · CORS origin check</text>

  <!-- 3 -->
  <line x1="630" y1="245" x2="878" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="754" y="235" text-anchor="middle" fill="#e2e8f0" font-size="12">3 · Upsert profile + query jobs</text>
  <text x="754" y="261" text-anchor="middle" fill="#fbbf24" font-size="11">service role key (server-side only)</text>

  <!-- 4 -->
  <line x1="878" y1="315" x2="632" y2="315" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="754" y="305" text-anchor="middle" fill="#e2e8f0" font-size="12">4 · Result (RLS checked)</text>

  <!-- 5 -->
  <line x1="630" y1="365" x2="382" y2="365" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="504" y="355" text-anchor="middle" fill="#e2e8f0" font-size="12">5 · 200 OK + match results</text>

  <!-- 6 -->
  <line x1="380" y1="415" x2="132" y2="415" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="256" y="405" text-anchor="middle" fill="#e2e8f0" font-size="12">6 · Display relevant jobs</text>

  <!-- note -->
  <rect x="690" y="430" width="290" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="4 4"/>
  <text x="835" y="450" text-anchor="middle" fill="#94a3b8" font-size="11">Jobs table is filled daily by the</text>
  <text x="835" y="466" text-anchor="middle" fill="#94a3b8" font-size="11">MauqaFinder scraper pipeline</text>
</svg>

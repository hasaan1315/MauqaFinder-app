<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e22"/>
      <stop offset="100%" stop-color="#0f1a13"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon background square -->
  <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="56" height="56" rx="14" fill="none" stroke="#10b981" stroke-width="1" opacity="0.35"/>

  <!-- M mark scaled to fit 56x56 box (original 160x160 → scale 0.35) -->
  <!-- Left leg, right leg, center peak of M -->
  <path d="M13 42 L13 18 L28 31 L43 18 L43 42"
    fill="none" stroke="url(#mark)" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Pin drop -->
  <circle cx="28" cy="46" r="3.8" fill="url(#mark)" filter="url(#glow)"/>
  <circle cx="28" cy="46" r="1.5" fill="#0f1a13"/>
  <line x1="28" y1="42" x2="28" y2="42.5" stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Name: Mauqa -->
  <text x="70" y="24" 
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
    font-size="22" font-weight="800" fill="#f1f5f9" letter-spacing="-0.3">Mauqa</text>

  <!-- Hyphen + Finder in green -->
  <text x="70" y="44" 
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" 
    font-size="13" font-weight="500" fill="#10b981" letter-spacing="3.5">FINDER</text>

  <!-- Accent dot after Mauqa -->
  <circle cx="148" cy="18" r="3" fill="#10b981"/>
</svg>

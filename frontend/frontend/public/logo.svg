<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e22"/>
      <stop offset="100%" stop-color="#0f1a13"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="160" height="160" rx="36" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>

  <!-- M lettermark with pin-drop tail -->
  <!-- Left leg of M -->
  <path d="M38 112 L38 52 L80 88 L122 52 L122 112" 
    fill="none" stroke="url(#mark)" stroke-width="11" 
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Pin drop circle at bottom center of M -->
  <circle cx="80" cy="118" r="9" fill="url(#mark)" filter="url(#glow)"/>
  <!-- Pin dot -->
  <circle cx="80" cy="118" r="3.5" fill="#0f1a13"/>

  <!-- Connecting line from M bottom to pin -->
  <line x1="80" y1="108" x2="80" y2="109" stroke="url(#mark)" stroke-width="11" stroke-linecap="round"/>
</svg>
